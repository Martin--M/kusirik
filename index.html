<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="kusirik — browse live channels, movies and series from any Xtream Codes server" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>kusirik</title>
    <style>
      html, body {
        background-color: #0f172a; /* Match app dark background to prevent white flash */
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #splash-screen {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        z-index: 9999;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }
      .splash-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #60a5fa;
        margin-bottom: 24px;
        letter-spacing: 0.05em;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(96, 165, 250, 0.15);
        border-radius: 50%;
        border-top-color: #60a5fa;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="splash-screen">
        <svg class="splash-logo" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
          <polygon points="10 11 15 14 10 17 10 11" fill="#60a5fa"></polygon>
        </svg>
        <div class="splash-title">kusirik</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
