name: Release Build

on:
  push:
    tags:
      - "v*"

# Prevent overlapping operations on identical tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        run: gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Windows Installer (.msi)
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup update stable

      - name: Configure Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows Installer
        run: npm run tauri:build

      - name: Upload Windows Asset to Release
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/bundle/msi/*.msi --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Android APK (.apk)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install Rust toolchain & Targets
        run: |
          rustup default stable
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Configure Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Android APK
        run: npx tauri android build --apk

      - name: Sign APK & Purge Key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > release.keystore
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" ! -name "*signed*")
          
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/app-release-signed.apk \
            "$UNSIGNED_APK"
            
          # Immediate cleanup configuration
          rm -f release.keystore

      - name: Upload Android APK to Release
        run: gh release upload ${{ github.ref_name }} src-tauri/gen/android/app/build/outputs/apk/universal/release/app-release-signed.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}